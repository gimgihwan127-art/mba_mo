<!doctype html>
<html lang="ko" class="no-js">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script>document.documentElement.classList.remove('no-js');</script>
<title>2026 하반기 라인업 — 캐스트</title>
<meta name="description" content="2026 하반기 라인업 캐스트. 극장에 모인 세무사와 회계사들의 이야기." />
<meta name="theme-color" content="#0A1B4D" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ─────────────────────────  1) 캐스트 수평 스크롤  ───────────────────────── -->
<section class="cast-carousel" id="cast" aria-label="라인업 캐스트">
  <div class="cast-carousel__sticky">
    <!-- 이미지는 '전체가 보이는 상태'(폭 100%)를 기준 크기로 두고,
         JS가 scale 로 확대해 화면을 채운 뒤 가로로 민다.
         다 밀면 scale 을 1로 되돌려 전체가 드러난다. -->
    <div class="cast-carousel__stage">
      <!-- width/height 는 자리 예약용이다. 이게 없으면 이미지가 도착하기 전
           JS가 높이 0을 재서 확대 배율을 1로 잡아버린다. -->
      <img class="cast-carousel__img"
           src="images/lineup-cast.png"
           width="6054" height="3407"
           loading="eager" decoding="async" fetchpriority="high"
           alt="2026 하반기 라인업에 참여하는 세무사와 회계사들" />
    </div>
    <div class="cast-carousel__scroll-hint">
      <span class="scroll-hint__text">SCROLL</span>
    </div>
  </div>
</section>

<!-- ─────────────────────────  2) 풀 페이지 랜딩  ───────────────────────── -->
<section class="lineup-full" id="full" aria-label="전체 라인업">
  <img class="lineup-full__img"
       src="images/lineup-full.png"
       width="1503" height="32768"
       loading="lazy" decoding="async"
       alt="2026 하반기 라인업 전체 페이지" />
</section>

<script src="main.js" defer></script>
</body>
</html>
